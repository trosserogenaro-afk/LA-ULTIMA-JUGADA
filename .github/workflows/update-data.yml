name: Actualizar datos de La Última Jugada

on:
  schedule:
    - cron: "0 */2 * * *"   # cada 2 horas (UTC)
    - cron: "0 3 * * *"     # 00:00 en Argentina
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar datos desde API-Football
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: node scripts/update-data.mjs

      - name: Guardar cambios
        run: |
          git config user.name "luj-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/luj-data.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualizar datos $(date -u +%F_%H:%M)"
            git push
          fi
