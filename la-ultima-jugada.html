<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ultima Jugada</title>
<style>
  body{margin:0;background:#0A0F0D;color:#F3F6F1;font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .load{text-align:center;opacity:.7}
  .spin{width:28px;height:28px;border:3px solid #243029;border-top-color:#34D399;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 12px}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="load"><div class="spin"></div>Cargando La Última Jugada…</div>
<script>
(async function(){
  const urls = [
    "https://raw.githubusercontent.com/trosserogenaro-afk/LA-ULTIMA-JUGADA/3ed1bd84092cb12bf561cfbff28e76315e991f61/la-ultima-jugada.html",
    "https://cdn.jsdelivr.net/gh/trosserogenaro-afk/LA-ULTIMA-JUGADA@3ed1bd84092cb12bf561cfbff28e76315e991f61/la-ultima-jugada.html"
  ];
  let html = null;
  for (const u of urls) {
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok) { html = await r.text(); break; }
    } catch(e) {}
  }
  if (!html) {
    document.body.innerHTML = "<p style='padding:24px;text-align:center'>No se pudo cargar. Recargá en unos segundos.</p>";
    return;
  }
  // Quitar el PNG roto del logo y poner título limpio
  html = html.replace(
    /<img src="la-ultima-jugada-logo\.png"[^>]*>/,
    '<h1 style="margin:0 0 2px;opacity:0;animation:riseIn .5s ease forwards;">⚽ La Última Jugada</h1>'
  );
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
