<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ultima Jugada</title>
<style>
  html,body{margin:0;padding:0;background:#0A0F0D;color:#F3F6F1;font-family:system-ui,sans-serif;height:100%}
  .boot{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:12px}
  .spin{width:28px;height:28px;border:3px solid #243029;border-top-color:#34D399;border-radius:50%;animation:s .7s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  .msg{opacity:.7;font-size:14px}
</style>
</head>
<body>
<div class="boot"><div class="spin"></div><div class="msg">Cargando La Última Jugada…</div></div>
<script>
(async function(){
  const urls = [
    "https://cdn.jsdelivr.net/gh/trosserogenaro-afk/LA-ULTIMA-JUGADA@3ed1bd84092cb12bf561cfbff28e76315e991f61/la-ultima-jugada.html",
    "https://raw.githubusercontent.com/trosserogenaro-afk/LA-ULTIMA-JUGADA/3ed1bd84092cb12bf561cfbff28e76315e991f61/la-ultima-jugada.html"
  ];
  let html = null;
  for (const u of urls) {
    try {
      const r = await fetch(u, {cache:"no-store"});
      if (r.ok) {
        html = await r.text();
        if (html && html.length > 50000) break;
      }
    } catch(e) {}
  }
  if (!html || html.length < 50000) {
    document.body.innerHTML = "<div class='boot'><p class='msg'>No se pudo cargar. Recargá en unos segundos.</p></div>";
    return;
  }
  var a = html.indexOf("la-ultima-jugada-logo.png");
  if (a !== -1) {
    var start = html.lastIndexOf("<img", a);
    var b = html.indexOf("hero-sub", a);
    if (start !== -1 && b !== -1) {
      b = html.lastIndexOf("<", b);
      html = html.slice(0, start)
        + "<h1 style='margin:0 0 2px'>La Ultima Jugada</h1>\n      "
        + html.slice(b);
    }
  }
  var anchor = "const styleEsc = crestStyle(lg,abbr)";
  var ai = html.indexOf(anchor);
  if (ai !== -1) {
    var semi = html.indexOf(";", ai);
    if (semi !== -1 && semi - ai < 80) {
      html = html.slice(0, ai) + "const styleEsc = crestStyle(lg,abbr)" + html.slice(semi);
    }
  }
  document.open("text/html");
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
