<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ultima Jugada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0F0D;
    --bg-alt:#101713;
    --card:#141D18;
    --card-hi:#192219;
    --line:#243029;
    --line-soft:#1A2420;
    --text:#F3F6F1;
    --dim:#8FA095;
    --dim2:#5E6E66;
    --turf:#34D399;
    --turf-dim:#1D5A44;
    --amber:#FBBF24;
    --amber-dim:#6B5419;
    --loss:#FB7185;
    --draw:#94A3A0;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{padding-bottom:60px;overflow-x:hidden;}
  ::selection{background:var(--turf);color:#04120C;}

  h1,h2,h3,.label{font-family:'Oswald',sans-serif;letter-spacing:.02em;}
  .mono{font-family:'Space Mono',monospace;}

  /* ---------- HERO ---------- */
  .hero{
    position:relative;
    padding:28px 18px 22px;
    background:
      radial-gradient(120% 100% at 10% -10%, rgba(52,211,153,.16), transparent 60%),
      radial-gradient(100% 80% at 100% 0%, rgba(251,191,36,.10), transparent 55%),
      var(--bg);
    overflow:hidden;
    border-bottom:1px solid var(--line-soft);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 1px, transparent 1px 34px);
    animation: sweep 12s linear infinite;
    opacity:.5;
    pointer-events:none;
  }
  @keyframes sweep{ from{background-position-x:0;} to{background-position-x:340px;} }
  .hero-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .eyebrow{color:var(--turf);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;
    opacity:0;animation:riseIn .5s ease forwards;}
  h1{font-size:26px;margin:4px 0 2px;font-weight:700;color:var(--text);
    opacity:0;animation:riseIn .5s ease .06s forwards;}
  .hero-sub{color:var(--dim);font-size:13px;margin:0;
    opacity:0;animation:riseIn .5s ease .12s forwards;}
  .refresh-btn{
    background:var(--card-hi); border:1px solid var(--line); color:var(--text);
    font-family:'Inter'; font-size:12px; font-weight:600; padding:9px 12px; border-radius:10px;
    cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap;
    transition:transform .15s ease, background .15s ease;
    opacity:0;animation:riseIn .5s ease .18s forwards;
  }
  .refresh-btn:hover{background:#1c2721; transform:translateY(-1px);}
  .refresh-btn:active{transform:scale(.96);}
  .refresh-btn svg{transition:transform .4s ease;}
  .refresh-btn.spin svg{transform:rotate(360deg);}

  .live-strip{
    margin-top:16px; display:flex; gap:10px; align-items:center; position:relative; z-index:1;
    opacity:0;animation:riseIn .5s ease .22s forwards;
  }
  .live-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);position:relative;flex:0 0 auto;}
  .live-dot::after{
    content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid var(--amber);
    animation:pulseRing 1.6s ease-out infinite;
  }
  @keyframes pulseRing{0%{transform:scale(.6);opacity:.9;}100%{transform:scale(2.1);opacity:0;}}
  .live-strip span{font-size:13px;color:var(--dim);}
  .live-strip b{color:var(--amber);font-family:'Space Mono';}

  @keyframes riseIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- NAV ---------- */
  .nav-wrap{position:sticky;top:0;z-index:20;background:rgba(10,15,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line-soft);}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--line);
    background:var(--card); color:var(--dim); font-family:'Oswald'; font-size:13px; font-weight:500;
    letter-spacing:.02em; cursor:pointer; white-space:nowrap; transition:.18s ease; position:relative;
  }
  .tab .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle;}
  .tab:hover{border-color:var(--turf-dim); color:var(--text);}
  .tab.active{background:var(--turf); color:#04120C; border-color:var(--turf); font-weight:700;}
  .tab.active .dot{background:#04120C;}

  .section-tabs{display:flex;gap:6px;padding:10px 14px 0;}
  .stab{
    padding:6px 12px;border-radius:9px;font-size:12.5px;font-weight:600;color:var(--dim);
    background:transparent;border:1px solid transparent;cursor:pointer;font-family:'Inter';
  }
  .stab.active{background:var(--card-hi); color:var(--text); border-color:var(--line);}

  /* ---------- MAIN ---------- */
  main{max-width:640px;margin:0 auto;padding:14px 14px 10px;}
  .panel{display:none;}
  .panel.active{display:block; animation:fadeSlide .35s ease;}
  @keyframes fadeSlide{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .group-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim2);margin:18px 2px 8px;font-weight:600;}
  .group-label:first-child{margin-top:4px;}

  /* match card */
  .match{
    display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line-soft);
    border-radius:var(--radius);padding:12px 14px;margin-bottom:8px;cursor:default;
    opacity:0; animation:cardIn .45s ease forwards;
    transition:border-color .15s ease, transform .15s ease;
  }
  .match:hover{border-color:var(--line);}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .side{flex:1;display:flex;align-items:center;gap:8px;min-width:0;cursor:pointer;border-radius:8px;padding:4px;transition:background .15s;}
  .side:hover{background:var(--card-hi);}
  .side.right{flex-direction:row-reverse;text-align:right;}
  .crest{
    width:28px;height:30px;background:var(--card-hi);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;font-family:'Oswald';
    color:var(--text);flex:0 0 auto;
    clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%);
    text-shadow:0 1px 2px rgba(0,0,0,.4);
  }
  .crest-img{width:28px;height:30px;object-fit:contain;flex:0 0 auto;}
  .match .side .crest-img{width:26px;height:26px;display:block;}

  /* ---------- MODO CARRERA ---------- */
  .role-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
  .role-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.15s;text-align:left;}
  .role-card:hover{border-color:var(--turf);transform:translateY(-1px);}
  .role-card .ico{font-size:22px;}
  .role-card h3{margin:6px 0 2px;font-size:16px;}
  .role-card p{margin:0;font-size:12.5px;color:var(--dim);}
  .career-hud{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap;}
  .hud-stat{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:8px 12px;flex:1;min-width:80px;text-align:center;}
  .hud-stat .v{font-family:'Space Mono';font-size:18px;font-weight:700;color:var(--turf);transition:color .3s;}
  .hud-stat .k{font-size:9.5px;color:var(--dim2);text-transform:uppercase;letter-spacing:.08em;}
  .season-tag{font-size:11.5px;color:var(--dim2);margin-bottom:6px;}
  .event-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px;margin-top:6px;animation:fadeSlide .35s ease;}
  .event-card h3{margin:0 0 4px;font-size:16px;}
  .event-card p.desc{color:var(--dim);font-size:13px;margin:0 0 14px;line-height:1.5;}
  .opt-btn{
    width:100%;text-align:left;background:var(--card-hi);border:1px solid var(--line);color:var(--text);
    border-radius:11px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:'Inter';transition:.15s;
  }
  .opt-btn:hover{border-color:var(--turf);}
  .opt-btn:active{transform:scale(.98);}
  .opt-btn .olabel{font-size:13.5px;font-weight:600;}
  .opt-btn .opct{float:right;font-family:'Space Mono';color:var(--amber);font-size:12.5px;}
  .result-banner{border-radius:11px;padding:12px 14px;margin-top:10px;font-size:13px;animation:rowIn .3s ease;}
  .result-banner.ok{background:rgba(52,211,153,.12);border:1px solid var(--turf-dim);color:var(--turf);}
  .result-banner.bad{background:rgba(251,113,133,.12);border:1px solid #6b2530;color:var(--loss);}
  .legend-card{
    background:linear-gradient(160deg, var(--card-hi), var(--bg));border:1px solid var(--line);border-radius:18px;
    padding:24px 20px;text-align:center;margin-top:10px;
  }
  .legend-card .tier{font-family:'Oswald';font-size:22px;font-weight:700;color:var(--amber);margin-bottom:4px;}
  .legend-card .sub{color:var(--dim);font-size:12.5px;margin-bottom:16px;}
  .legend-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin-bottom:16px;}
  .legend-stats div{background:var(--card);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--dim);}
  .legend-stats b{display:block;font-family:'Space Mono';font-size:16px;color:var(--text);}
  .again-btn{background:var(--turf);color:#04120C;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-family:'Oswald';cursor:pointer;}
  .udl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px;}
  .udl-club{background:var(--card);border:1px solid var(--line-soft);border-radius:11px;padding:10px 4px;text-align:center;}
  .udl-club img{width:38px;height:38px;object-fit:contain;margin-bottom:4px;}
  .udl-club span{display:block;font-size:9.5px;color:var(--dim);line-height:1.2;}

  /* ---------- MODO CARRERA v2: setup, cancha, tabla, chips ---------- */
  .setup-section{margin-top:18px;}
  .setup-section h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin:0 0 8px;}
  .name-input{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;
    color:var(--text);font-family:'Oswald';font-size:15px;letter-spacing:.03em;text-transform:uppercase;}
  .name-input:focus{outline:none;border-color:var(--turf);}
  .club-pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:280px;overflow-y:auto;padding:2px;}
  .club-pick{background:var(--card);border:1px solid var(--line-soft);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;transition:.15s;}
  .club-pick:hover{border-color:var(--turf-dim);}
  .club-pick img{width:30px;height:30px;object-fit:contain;margin-bottom:3px;}
  .club-pick span{display:block;font-size:9px;color:var(--dim);line-height:1.15;}
  .club-pick.sel{border-color:var(--turf);background:rgba(52,211,153,.08);}
  .club-pick.sel span{color:var(--turf);font-weight:600;}
  .pitch-field{position:relative;width:100%;aspect-ratio:3/4;background:linear-gradient(180deg,#0d1f16,#0a1710);
    border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:4px;}
  .pitch-field::before{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;
    border:1px solid rgba(255,255,255,.15);border-radius:50%;transform:translate(-50%,-50%);}
  .pitch-field::after{content:"";position:absolute;left:8%;right:8%;top:50%;border-top:1px solid rgba(255,255,255,.12);}
  .pos-btn{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;
    background:var(--card-hi);border:1px solid var(--line);color:var(--dim);font-family:'Space Mono';
    font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
  .pos-btn:hover{border-color:var(--turf);}
  .pos-btn.sel{background:var(--turf);color:#04120C;border-color:var(--turf);}
  .confirm-btn{width:100%;background:var(--turf);color:#04120C;border:none;padding:13px;border-radius:11px;
    font-weight:700;font-family:'Oswald';font-size:14px;cursor:pointer;margin-top:20px;transition:.15s;}
  .confirm-btn:disabled{background:var(--card-hi);color:var(--dim2);cursor:not-allowed;}
  .confirm-btn:not(:disabled):active{transform:scale(.98);}
  .back-link{background:none;border:none;color:var(--dim2);font-size:12px;cursor:pointer;padding:0;margin-bottom:10px;}
  .back-link:hover{color:var(--turf);}

  .player-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line-soft);
    border-radius:var(--radius);padding:14px;margin-top:14px;opacity:0;animation:riseIn .4s ease forwards;}
  .ovr-badge{width:50px;height:50px;border-radius:12px;background:linear-gradient(160deg,var(--amber),#b8790f);
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono';font-weight:700;font-size:19px;
    color:#1a1204;flex:0 0 auto;transition:background .4s;}
  .player-meta .pname{font-family:'Oswald';font-weight:700;font-size:15px;}
  .player-meta .posbadge{font-size:10px;background:var(--card-hi);color:var(--dim);padding:2px 6px;border-radius:5px;margin-left:6px;}
  .player-meta .pclub{font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;margin-top:3px;}
  .player-meta .page{font-size:11px;color:var(--dim2);margin-top:2px;}
  .mini-crest{width:18px;height:18px;object-fit:contain;vertical-align:middle;}

  .career-table{margin-top:12px;}
  .career-table td.team{display:flex;align-items:center;gap:6px;font-size:12px;}
  .career-table .pending-row td{color:var(--dim2);font-style:italic;}

  .opt-btn2{width:100%;text-align:left;background:var(--card-hi);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:9px;cursor:pointer;transition:.15s;
    opacity:0;animation:riseIn .35s ease forwards;}
  .opt-btn2:hover{border-color:var(--turf);}
  .opt-btn2:active{transform:scale(.98);}
  .olabel2{font-family:'Oswald';font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .chip{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;padding:5px 9px;border-radius:7px;
    margin-bottom:5px;opacity:0;animation:chipIn .3s ease forwards;}
  .chip:last-child{margin-bottom:0;}
  .chip.pos{background:rgba(52,211,153,.12);color:var(--turf);}
  .chip.neg{background:rgba(251,113,133,.12);color:var(--loss);}
  .chip.neutral{background:rgba(148,163,160,.10);color:var(--draw);}
  .chip span{font-family:'Space Mono';font-weight:700;}
  @keyframes chipIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
  .tname{font-size:13.5px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mid{flex:0 0 auto;text-align:center;min-width:76px;}
  .score{font-family:'Space Mono';font-size:19px;font-weight:700;letter-spacing:.02em;display:flex;gap:6px;justify-content:center;}
  .score .dash{color:var(--dim2);}
  .kickoff{font-family:'Space Mono';font-size:12px;color:var(--dim);}
  .status-pill{font-size:9.5px;font-weight:700;letter-spacing:.06em;padding:2px 7px;border-radius:5px;margin-top:4px;display:inline-block;}
  .status-pill.live{background:rgba(251,191,36,.15);color:var(--amber);}
  .status-pill.live .live-dot{width:5px;height:5px;margin-right:4px;}
  .status-pill.final{background:rgba(148,163,160,.14);color:var(--draw);}
  .status-pill.sched{background:rgba(52,211,153,.10);color:var(--turf);}

  /* standings */
  table.standings{width:100%;border-collapse:collapse;background:var(--card);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line-soft);}
  table.standings th{
    font-family:'Oswald';font-size:10.5px;letter-spacing:.06em;color:var(--dim2);text-transform:uppercase;
    padding:9px 6px;text-align:center;border-bottom:1px solid var(--line-soft);cursor:pointer;user-select:none;
  }
  table.standings th.sortable:hover{color:var(--turf);}
  table.standings th .arrow{font-size:9px;margin-left:2px;opacity:.6;}
  table.standings th:first-child, table.standings td:first-child{text-align:left;padding-left:12px;}
  table.standings td{padding:9px 6px;text-align:center;font-size:13px;border-bottom:1px solid var(--line-soft);}
  table.standings tr:last-child td{border-bottom:none;}
  table.standings tr.rowfade{opacity:0;animation:rowIn .3s ease forwards;}
  @keyframes rowIn{from{opacity:0;transform:translateX(-4px);}to{opacity:1;transform:translateX(0);}}
  table.standings td.team{text-align:left;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:8px;}
  table.standings td.team:hover{color:var(--turf);}
  table.standings td.team .crest-img, table.standings td.team .crest{width:22px;height:24px;flex:0 0 auto;}
  table.standings td.pts{font-family:'Space Mono';font-weight:700;color:var(--turf);}
  table.standings .rank{color:var(--dim2);font-family:'Space Mono';font-size:12px;}

  /* referencia / notas */
  .note{
    background:var(--card); border:1px dashed var(--line); border-radius:12px; padding:12px 14px;
    font-size:12.5px; color:var(--dim); line-height:1.55; margin:10px 0 16px;
  }
  .note b{color:var(--text);}
  .link-out{
    display:inline-flex;align-items:center;gap:5px;color:var(--turf);font-size:12.5px;font-weight:600;
    text-decoration:none;margin-top:6px;
  }
  .link-out:hover{text-decoration:underline;}

  .sa-card{background:var(--card);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px;margin-bottom:14px;}
  .sa-title{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
  .sa-title .stripe{width:4px;height:16px;border-radius:2px;}
  .sa-title h3{margin:0;font-size:15px;}
  .sa-meta{font-size:11.5px;color:var(--dim2);margin-bottom:10px;}
  .fixture-row{display:flex;justify-content:space-between;font-size:12.5px;padding:6px 0;border-bottom:1px solid var(--line-soft);color:var(--dim);}
  .fixture-row:last-child{border-bottom:none;}
  .fixture-row b{color:var(--text);font-weight:500;}

  .gk-card{background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;
    opacity:0;animation:rowIn .35s ease forwards;}
  .gk-name{font-size:13.5px;font-weight:600;}
  .gk-comp{font-size:11px;color:var(--dim2);}
  .gk-goals{font-family:'Space Mono';font-size:18px;font-weight:700;color:var(--amber);}

  /* overlay / team detail */
  .overlay{
    position:fixed;inset:0;background:rgba(4,8,6,.7);backdrop-filter:blur(2px);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .25s ease;
  }
  .overlay.open{opacity:1;pointer-events:auto;}
  .sheet{
    background:var(--bg-alt);width:100%;max-width:640px;max-height:86vh;overflow-y:auto;
    border-radius:20px 20px 0 0;border:1px solid var(--line);border-bottom:none;
    padding:18px 18px 28px;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,.9,.35,1);
  }
  .overlay.open .sheet{transform:translateY(0);}
  .sheet-handle{width:36px;height:4px;background:var(--line);border-radius:3px;margin:0 auto 14px;}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:12px;}
  .sheet-head-left{display:flex;align-items:center;gap:12px;min-width:0;}
  .sheet-crest{width:52px;height:52px;object-fit:contain;flex:0 0 auto;background:var(--card);border-radius:12px;border:1px solid var(--line-soft);padding:4px;}
  .sheet-crest-fallback{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:700;font-size:14px;flex:0 0 auto;border:1px solid var(--line);}
  .sheet-head h2{margin:0;font-size:20px;line-height:1.15;}
  .sheet-rank{font-size:12.5px;color:var(--dim);margin-top:2px;}
  .sheet-close{background:none;border:none;color:var(--dim);font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;flex:0 0 auto;}
  .club-info{
    background:var(--card);border:1px solid var(--line-soft);border-radius:12px;padding:10px 14px;margin:12px 0 4px;
    display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;
  }
  .club-info .ci-row{display:flex;flex-direction:column;gap:2px;}
  .club-info .ci-k{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim2);font-weight:600;}
  .club-info .ci-v{font-size:13px;color:var(--text);font-weight:500;}

  .form-chip.L{background:rgba(251,113,133,.18);color:var(--loss);}
  .form-chip.D{background:rgba(148,163,160,.18);color:var(--draw);}
  .sheet h4{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim2);margin:16px 0 8px;}
  .mini-match{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13px;}
  .mini-match:last-child{border-bottom:none;}
  .mini-match .opp{color:var(--text);}
  .mini-match .sc{font-family:'Space Mono';font-weight:700;}
  .mini-match .res{width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-right:8px;}
  .mini-left{display:flex;align-items:center;}
  .stat-bar-wrap{margin-bottom:10px;}
  .stat-label-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--dim);margin-bottom:4px;font-family:'Space Mono';}
  .stat-track{height:6px;background:var(--line-soft);border-radius:4px;overflow:hidden;display:flex;}
  .stat-fill-a{height:100%;background:var(--turf);width:0;transition:width .8s cubic-bezier(.22,.9,.35,1);}
  .stat-fill-b{height:100%;background:var(--amber);width:0;transition:width .8s cubic-bezier(.22,.9,.35,1);margin-left:auto;}
  .empty-hint{color:var(--dim2);font-size:12.5px;padding:10px 0;}
  .udl-club{cursor:pointer;transition:border-color .15s,transform .15s;}
  .udl-club:hover{border-color:var(--turf);transform:translateY(-1px);}

  /* plantel / jugadores API */
  .plantel-loading{display:flex;align-items:center;gap:10px;padding:14px 0;color:var(--dim);font-size:13px;}
  .plantel-spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--turf);border-radius:50%;animation:spin 0.7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .pos-group{margin-bottom:12px;}
  .pos-group-title{font-family:'Oswald';font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--turf);background:rgba(52,211,153,.08);border:1px solid var(--turf-dim);border-radius:8px;padding:5px 10px;margin-bottom:6px;display:inline-block;}
  .player-row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line-soft);}
  .player-row:last-child{border-bottom:none;}
  .player-num{font-family:'Space Mono';font-size:12px;color:var(--amber);min-width:22px;text-align:center;font-weight:700;}
  .player-photo{width:32px;height:32px;border-radius:50%;object-fit:cover;background:var(--card-hi);border:1px solid var(--line);flex:0 0 auto;}
  .player-photo.ph{display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--dim2);}
  .player-name{font-size:13px;font-weight:600;line-height:1.2;}
  .player-meta{font-size:11px;color:var(--dim2);margin-top:1px;}
  .plantel-source{font-size:11px;color:var(--dim2);margin-top:10px;line-height:1.4;}

  .sa-card td.team .crest-img{width:20px;height:22px;}
  
  /* detalle partido */
  .md-scoreboard{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line-soft);border-radius:16px;padding:16px 12px;margin-bottom:4px;}
  .md-team{flex:1;text-align:center;min-width:0;}
  .md-team img,.md-team .crest{width:44px;height:44px;margin:0 auto 6px;display:block;object-fit:contain;}
  .md-team .n{font-family:'Oswald';font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .md-mid{text-align:center;min-width:88px;}
  .md-mid .sc{font-family:'Space Mono';font-size:28px;font-weight:700;letter-spacing:.02em;}
  .md-mid .st{font-size:11px;color:var(--dim);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}

  .ev-row{display:grid;grid-template-columns:28px 1fr 42px;gap:8px;align-items:start;padding:10px 12px;border-bottom:1px solid var(--line-soft);font-size:12.5px;line-height:1.4;}

  .footer-note{max-width:640px;margin:24px auto 0;padding:0 14px;text-align:center;color:var(--dim2);font-size:11.5px;line-height:1.6;}

  @media(min-width:520px){
    .sheet{border-radius:20px;margin-bottom:6vh;}
    .overlay{align-items:center;}

  .game-wrap{margin-top:4px;}
  .game-hint{font-size:12px;color:var(--dim);margin-bottom:12px;line-height:1.5;}

  .saque-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .saque-btn{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--card-hi);

  .saque-btn.right{background:rgba(52,211,153,.18);border-color:var(--turf);}
  .saque-btn.wrong{background:rgba(251,113,133,.14);border-color:var(--loss);opacity:.5;}
  /* ta-te-ti */
  .ttt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:220px;margin:0 auto;}
  .ttt-cell{aspect-ratio:1;background:var(--card-hi);border:1px solid var(--line);border-radius:10px;
    display:flex;align-items:center;justify-content:center;font-family:'Space Mono';font-weight:700;font-size:26px;cursor:pointer;transition:.15s;}
  .ttt-cell:hover:empty{border-color:var(--turf);}
  .ttt-cell.x{color:var(--turf);}
  .ttt-cell.o{color:var(--loss);}
  .ttt-status{text-align:center;font-size:12.5px;color:var(--dim);margin-top:12px;min-height:16px;}
  /* rps */
  .rps-grid{display:flex;gap:10px;justify-content:center;}
  .rps-btn{width:64px;height:64px;border-radius:50%;background:var(--card-hi);border:1px solid var(--line);

  .rps-result{text-align:center;margin-top:14px;font-size:13px;color:var(--dim);min-height:18px;}
  /* definicion */
  .def-track{position:relative;height:14px;background:var(--card-hi);border:1px solid var(--line);border-radius:8px;margin:18px 0;overflow:hidden;}
  .def-zone{position:absolute;top:0;bottom:0;background:rgba(52,211,153,.25);border-left:1px solid var(--turf);border-right:1px solid var(--turf);}
  .def-marker{position:absolute;top:-4px;width:8px;height:22px;border-radius:3px;background:var(--amber);
    animation:defMove 1.8s linear infinite alternate;}
  @keyframes defMove{from{left:0%;}to{left:calc(100% - 8px);}}
  .def-btn{width:100%;background:var(--turf);color:#04120C;border:none;padding:13px;border-radius:11px;
    font-weight:700;font-family:'Oswald';font-size:14px;cursor:pointer;}
  .def-btn:active{transform:scale(.98);}
  /* memotest */
  .memo-hud{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:var(--dim2);margin-bottom:10px;}
  .memo-lives span{margin-right:2px;}
  .memo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
  .memo-card{aspect-ratio:1;border-radius:9px;background:var(--card-hi);border:1px solid var(--line);

  .simon-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:220px;margin:0 auto;}
  .simon-dot{aspect-ratio:1;border-radius:50%;background:var(--card-hi);border:1px solid var(--line);cursor:pointer;transition:.12s;}

  .simon-status{text-align:center;font-size:12.5px;color:var(--dim);margin-top:14px;min-height:16px;}

function saCrest(name){
  if(!name) return "";
  let url = SA_CRESTS[name];
  if(!url){
    // normalizar: quitar espacios raros, buscar por includes
    const n = name.trim();
    if(SA_CRESTS[n]) url = SA_CRESTS[n];
    else {
      const key = Object.keys(SA_CRESTS).find(k=>{
        const a=k.toLowerCase(), b=n.toLowerCase();
        return a===b || a.includes(b) || b.includes(a) || a.replace(/[^a-z0-9]/g,"")===b.replace(/[^a-z0-9]/g,"");
      });
      if(key) url = SA_CRESTS[key];
    }
  }
  if(url) return `<img src="${url}" class="crest-img" alt="" loading="lazy" onerror="this.remove()">`;
  return "";
}

function crestUrlFor(lg, abbr){
  // PAR se usa en Serie A (Parma) y Ligue 1 (Paris FC)
  if(abbr==="PAR" && lg && lg.name==="Ligue 1") return "https://media.api-sports.io/football/teams/114.png";
  if(abbr==="PAR" && lg && lg.name==="Serie A") return "https://media.api-sports.io/football/teams/523.png";
  return CREST_URLS[abbr];
}
function crestHTML(lg, abbr){
  const url = crestUrlFor(lg, abbr);
  const style = crestStyle(lg,abbr).replace(/'/g,"\\'");
  if(url){
    return `<img src="${url}" class="crest-img" onerror="crestFallback(this,'${style}','${abbr}')" alt="${abbr}">`;
  }
  return `<div class="crest" style="${crestStyle(lg,abbr)}">${abbr}</div>`;
}
function crestFallback(img,style,abbr){
  const div=document.createElement('div');
  div.className='crest'; div.setAttribute('style',style); div.textContent=abbr;
  img.replaceWith(div);
}

function fmtScore(m){
  if(m.status==="sched") return `<div class="kickoff">${m.when.split(",").pop().trim()}</div>`;
  return `<div class="score">${m.hs}<span class="dash">–</span>${m.as}</div>`;
}
function statusPill(m){
  if(m.status==="live") return `<span class="status-pill live"><span class="live-dot" style="display:inline-block;position:relative;"></span>EN VIVO</span>`;
  if(m.status==="final") return `<span class="status-pill final">FINAL</span>`;
  return `<span class="status-pill sched">${m.when.split(",")[0]}</span>`;
}

function renderEuro(){
  const lg = EURO[activeLeague];

function crestStyle(lg,abbr){
  // pseudo-escudo: color derivado del nombre del equipo + acento de la liga, no es un logo real
  let hash=0; for(const c of abbr) hash = (hash*31 + c.charCodeAt(0)) & 0xffffffff;
  const hue = Math.abs(hash) % 360;
  return `background:linear-gradient(160deg, hsl(${hue} 45% 22%), ${lg.accent}); border-color:hsl(${hue} 40% 32%)`;
}
function matchCard(m,lg,i,leagueKey){
  const lk = leagueKey || activeLeague;

function posOrder(p){
  const s=(p||"").toLowerCase();
  if(/goal|keeper|arquero|portero|gk/.test(s)) return 0;
  if(/back|defen|centre-back|full-back|lateral/.test(s)) return 1;
  if(/mid|medio|wing.?back/.test(s)) return 2;
  if(/forward|attack|striker|winger|delantero|wing/.test(s)) return 3;
  if(/coach|manager|staff/.test(s)) return 9;
  return 4;
}
function posLabel(p){
  const s=(p||"").toLowerCase();
  if(/goal|keeper|arquero|portero|gk/.test(s)) return "ARQUEROS";
  if(/back|defen|centre-back|full-back|lateral/.test(s)) return "DEFENSORES";
  if(/mid|medio|wing.?back/.test(s)) return "MEDIOCAMPISTAS";
  if(/forward|attack|striker|winger|delantero|wing/.test(s)) return "DELANTEROS";
  if(/coach|manager|staff/.test(s)) return "CUERPO TÉCNICO";
  return "OTROS";
}
function ageFromBorn(dateBorn){
  if(!dateBorn) return "";
  const d=new Date(dateBorn); if(isNaN(d)) return "";
  const now=new Date();
  let a=now.getFullYear()-d.getFullYear();
  const m=now.getMonth()-d.getMonth();
  if(m<0||(m===0&&now.getDate()<d.getDate())) a--;
  return a>0?a+" años":"";
}
function renderPlantelHTML(players){
  if(!players||!players.length){
    return `<div class="empty-hint">Plantel no disponible acá. <a class="link-out" href="https://www.promiedos.com.ar/" target="_blank">Ver planteles en Promiedos →</a><br><span style="font-size:11px;color:var(--dim2)">TheSportsDB no tiene plantel completo de todos los clubes AR/UY.</span></div>`;
  }
  const filtered=players.filter(p=>{
    const pos=(p.strPosition||"");
    return !/manager only/i.test(pos);
  });
  filtered.sort((a,b)=>{
    const oa=posOrder(a.strPosition), ob=posOrder(b.strPosition);
    if(oa!==ob) return oa-ob;
    const na=parseInt(a.strNumber,10)||999, nb=parseInt(b.strNumber,10)||999;
    return na-nb;
  });
  let html="", lastGroup=null;
  filtered.forEach(p=>{
    const g=posLabel(p.strPosition);
    if(g!==lastGroup){
      html+=`<div class="pos-group"><div class="pos-group-title">${g}</div>`;
      lastGroup=g;
    }
    const num=p.strNumber?`<span class="player-num">${p.strNumber}</span>`:`<span class="player-num">–</span>`;
    const photo=p.strCutout||p.strThumb;
    const photoHtml=photo
      ?`<img class="player-photo" src="${photo}" alt="" loading="lazy" onerror="this.outerHTML='<div class=\\'player-photo ph\\'>👤</div>'">`
      :`<div class="player-photo ph">👤</div>`;
    const age=ageFromBorn(p.dateBorn);
    const nat=p.strNationality||"";
    const meta=[p.strPosition, age, nat].filter(Boolean).join(" · ");
    html+=`<div class="player-row">${num}${photoHtml}<div><div class="player-name">${p.strPlayer||"—"}</div><div class="player-meta">${meta}</div></div></div>`;
  });
  if(lastGroup) html+="</div>";
  html+=`<div class="plantel-source">Fuente: TheSportsDB. El plantel puede estar incompleto.</div>`;
  return html;
}
async function fetchSquad(teamName){
  const key=teamName;
  if(SQUAD_CACHE[key]) return SQUAD_CACHE[key];
  const cached = cacheGet("squad_"+key);
  if(cached){ SQUAD_CACHE[key]=cached; return cached; }
  const q=encodeURIComponent(TSDB_SEARCH[teamName]||teamName);
  try{
    const tr=await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchteams.php?t=${q}`);
    if(!tr.ok) throw new Error("team search failed");
    const tj=await tr.json();
    const teams=(tj.teams||[]).filter(t=>t.strSport==="Soccer"||t.strSport==="Football");
    const team=teams[0];
    if(!team||!team.idTeam){ SQUAD_CACHE[key]=[]; cacheSet("squad_"+key,[]); return []; }
    const pr=await fetch(`https://www.thesportsdb.com/api/v1/json/3/lookup_all_players.php?id=${team.idTeam}`);
    if(!pr.ok) throw new Error("players failed");
    const pj=await pr.json();
    const players=pj.player||[];
    SQUAD_CACHE[key]=players;
    cacheSet("squad_"+key, players);
    return players;
  }catch(e){
    console.warn("Squad API error", e);
    SQUAD_CACHE[key]=null;
    return null;
  }
}

function openTeam(leagueKey, abbr){
  const lg = EURO[leagueKey];
  if(!lg) return;
  const standing = (lg.standings||[]).find(s=>s.t===abbr);
  const teamMatches = (lg.matches||[]).filter(m=>m.home===abbr||m.away===abbr);
  const played = teamMatches.filter(m=>m.status==="final").reverse();
  const upcoming = teamMatches.filter(m=>m.status==="sched"||m.status==="live");
  const info = TEAM_INFO[abbr] || null;
  const crestUrl = crestUrlFor(lg, abbr);
  const name = lg.names[abbr]||abbr;

  let formHtml = played.slice(0,5).reverse().map(m=>{
    const isHome = m.home===abbr;
    const gf = isHome?m.hs:m.as, ga = isHome?m.as:m.hs;
    const res = gf>ga?"W":gf<ga?"L":"D";
    return `<div class="form-chip ${res}">${res}</div>`;
  }).join("");

  let recentHtml = played.length ? played.map(m=>{
    const isHome=m.home===abbr; const opp=isHome?m.away:m.home;
    const gf=isHome?m.hs:m.as, ga=isHome?m.as:m.hs;
    const res=gf>ga?"W":gf<ga?"L":"D";

/* ---- Detalle de partido (estilo Promiedos) via ESPN summary ---- */
function traducirEventoESPN(e){
  const typ = ((e.type && (e.type.type || e.type.text)) || "").toLowerCase();
  const raw = (e.text || e.shortText || "").trim();
  const clock = (e.clock && e.clock.displayValue) || "";
  let icon = "•";
  let text = raw;

  // Iconos
  if(e.scoringPlay || /goal|penalty---scored|penalty - scored/.test(typ)) icon = "⚽";
  else if(/yellow/.test(typ)) icon = "🟨";
  else if(/red/.test(typ)) icon = "🟥";
  else if(/sub/.test(typ)) icon = "🔄";
  else if(/penalty.*miss|missed/.test(typ)) icon = "❌";
  else if(/var/.test(typ)) icon = "📺";
  else if(/kickoff|start/.test(typ)) icon = "▶️";
  else if(/end|full-time|ft/.test(typ)) icon = "🏁";
  else if(/own.?goal/.test(typ)) icon = "⚽";

  // Traducciones básicas del inglés de ESPN
  if(raw){
    text = raw
      .replace(/is shown the yellow card for a bad foul\.?/gi, "ve la tarjeta amarilla")
      .replace(/is shown the yellow card\.?/gi, "ve la tarjeta amarilla")
      .replace(/is shown the red card\.?/gi, "ve la tarjeta roja")
      .replace(/Yellow Card/gi, "Tarjeta amarilla")
      .replace(/Red Card/gi, "Tarjeta roja")
      .replace(/Substitution,\s*/gi, "Cambio, ")
      .replace(/replaces/gi, "reemplaza a")
      .replace(/Goal!/gi, "¡Gol!")
      .replace(/Penalty missed\.?/gi, "Penal errado.")
      .replace(/Penalty - Scored/gi, "Penal convertido")
      .replace(/right footed shot is too high\.?/gi, "disparo con derecha se va alto.")
      .replace(/left footed shot/gi, "disparo con izquierda")
      .replace(/right footed shot/gi, "disparo con derecha")
      .replace(/from the centre of the box to the bottom left corner\.?/gi, "desde el área al ángulo izquierdo.")
      .replace(/from the centre of the box/gi, "desde el área")
      .replace(/to the bottom left corner\.?/gi, "al ángulo izquierdo.")
      .replace(/to the bottom right corner\.?/gi, "al ángulo derecho.")
      .replace(/Assisted by/gi, "Asistencia de")
      .replace(/following a fast break\.?/gi, "tras una contra.")
      .replace(/First Half begins\.?/gi, "Comienza el primer tiempo.")
      .replace(/Second Half begins\.?/gi, "Comienza el segundo tiempo.")
      .replace(/First Half ends?\.?/gi, "Fin del primer tiempo.")
      .replace(/Second Half ends?\.?/gi, "Fin del segundo tiempo.")
      .replace(/Match ends\.?/gi, "Final del partido.")
      .replace(/is shown the yellow card for a bad foul/gi, "ve la tarjeta amarilla")
      .replace(/for a bad foul\.?/gi, "")
      .replace(/Own Goal/gi, "Autogol")
      .replace(/VAR Decision/gi, "Decisión del VAR")
      .replace(/Attempt blocked/gi, "Remate bloqueado")
      .replace(/Attempt saved/gi, "Remate atajado")
      .replace(/Attempt missed/gi, "Remate desviado")
      .replace(/Corner,/gi, "Córner,")
      .replace(/Free kick/gi, "Tiro libre")
      .replace(/Offside/gi, "Offside")
      .replace(/Foul by/gi, "Falta de");
  } else {
    if(/yellow/.test(typ)) text = "Tarjeta amarilla";
    else if(/red/.test(typ)) text = "Tarjeta roja";
    else if(/sub/.test(typ)) text = "Cambio";
    else if(/goal/.test(typ)) text = "Gol";
    else text = e.type && e.type.text ? e.type.text : "Evento";
  }
  return { icon, text, clock, goal: !!(e.scoringPlay || /goal|penalty---scored/.test(typ)) };
}

   Transfermarkt (API no oficial)
   Base pública de prueba: https://transfermarkt-api.fly.dev
   Sin key. Puede fallar / rate-limit — siempre hay fallback a la web.
   Docs: https://transfermarkt-api.fly.dev/docs
   ========================================================= */

/* Caché local (localStorage) — guarda respuestas API 6 horas */
const API_CACHE_TTL = 6 * 60 * 60 * 1000;
function cacheGet(key){
  try{
    const raw = localStorage.getItem("luj_"+key);
    if(!raw) return null;
    const o = JSON.parse(raw);
    if(Date.now() - o.ts > API_CACHE_TTL) return null;
    return o.data;
  }catch(e){ return null; }
}
function cacheSet(key, data){
  try{ localStorage.setItem("luj_"+key, JSON.stringify({ts:Date.now(), data})); }catch(e){}
}

const TM_API = "https://transfermarkt-api.fly.dev";
const TM_CACHE = {};

// IDs conocidos Transfermarkt (club) para atajos
const TM_CLUB_IDS = {
  "Boca":"243","Boca Juniors":"243","River Plate":"209","Independiente":"1234",
  "Racing":"1444","San Lorenzo":"1775","Vélez":"1027","Estudiantes (LP)":"1023",
  "Lanús":"333","Huracán":"1447","Newell's Old Boys":"1446","Rosario Central":"1445",
  "Argentinos Juniors":"1235","Banfield":"1236","Gimnasia (LP)":"1448",
  "Arsenal":"11","Man United":"985","Man City":"281","Liverpool":"31","Chelsea":"631",
  "Tottenham":"148","Barcelona":"131","Real Madrid":"418","Atlético Madrid":"13",
  "Bayern Múnich":"27","B. Dortmund":"16","Inter":"46","AC Milan":"5","Juventus":"506",
  "Napoli":"6195","PSG":"583","Marsella":"244","Lyon":"1041",
};

async function tmFetch(path){
  const url = TM_API + path;
  const ctrl = new AbortController();
  const to = setTimeout(()=>ctrl.abort(), 12000);
  try{
    const r = await fetch(url, { signal: ctrl.signal, headers: { "Accept":"application/json" } });
    clearTimeout(to);
    if(!r.ok) throw new Error("TM "+r.status);
    return await r.json();
  }catch(e){
    clearTimeout(to);
    throw e;
  }
}

async function tmSearchClub(name){
  const key = "club:"+name;
  if(TM_CACHE[key]) return TM_CACHE[key];
  if(TM_CLUB_IDS[name]){
    TM_CACHE[key] = { id: TM_CLUB_IDS[name], name };
    return TM_CACHE[key];
  }
  try{
    const data = await tmFetch("/clubs/search/" + encodeURIComponent(name));
    const list = data.results || data.clubs || data || [];
    const first = Array.isArray(list) ? list[0] : null;
    const id = first && (first.id || first.clubId || first.transfermarkt_id);
    if(id){ TM_CACHE[key] = { id: String(id), name: first.name || name }; return TM_CACHE[key]; }
  }catch(e){ console.warn("TM search club", e); }
  TM_CACHE[key] = null;
  return null;
}

async function tmClubPlayers(clubId){
  const key = "players:"+clubId;
  if(TM_CACHE[key]) return TM_CACHE[key];
  try{
    // endpoints posibles según versiones de la API
    let data = null;
    for(const path of [`/clubs/${clubId}/players`, `/clubs/${clubId}/players?season_id=2025`]){
      try{ data = await tmFetch(path); break; }catch(_){}
    }
    const players = (data && (data.players || data.squad || data)) || [];
    TM_CACHE[key] = Array.isArray(players) ? players : [];
    return TM_CACHE[key];
  }catch(e){
    console.warn("TM players", e);
    TM_CACHE[key] = null;
    return null;
  }
}

function formatMarketValue(v){
  if(v==null || v==="") return "—";
  if(typeof v === "number"){
    if(v >= 1e6) return "€" + (v/1e6).toFixed(1) + "M";
    if(v >= 1e3) return "€" + (v/1e3).toFixed(0) + "K";
    return "€" + v;
  }
  const s = String(v);
  if(/€|EUR/i.test(s)) return s;
  return s;
}

function renderTmPlayersHTML(players, clubName){
  if(!players || !players.length){
    return `<div class="empty-hint">Sin plantel TM. <a class="link-out" href="https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(clubName)}" target="_blank">Buscar en Transfermarkt →</a></div>`;
  }
  // sort by market value if present
  const sorted = [...players].sort((a,b)=>{
    const va = parseFloat(a.marketValue || a.market_value || a.marketValueNum || 0) || 0;
    const vb = parseFloat(b.marketValue || b.market_value || b.marketValueNum || 0) || 0;
    return vb - va;
  });

/* =========================================================
   ESPN public API (sin key) — scoreboard + standings
   https://site.api.espn.com/apis/site/v2/sports/soccer/{league}/scoreboard
   ========================================================= */
const ESPN_LEAGUES = {
  epl: "eng.1",
  la_liga: "esp.1",
  serie_a: "ita.1",
  bundesliga: "ger.1",
  ligue_1: "fra.1",
};
const ESPN_ARG = "arg.1";

function espnDateStr(d){
  // YYYYMMDD
  const x = d || new Date();
  const y = x.getFullYear();
  const m = String(x.getMonth()+1).padStart(2,"0");
  const day = String(x.getDate()).padStart(2,"0");
  return `${y}${m}${day}`;
}

function mapEspnStatus(ev){
  const st = (ev.status && ev.status.type) || {};
  if(st.state==="in" || st.name==="STATUS_IN_PROGRESS" || st.name==="STATUS_HALFTIME") return "live";
  if(st.completed || st.state==="post" || st.name==="STATUS_FULL_TIME" || st.name==="STATUS_FINAL") return "final";
  return "sched";
}

function abbrFromEspnTeam(team){
  if(!team) return "???";
  const a = (team.abbreviation || team.shortDisplayName || team.displayName || "?").toUpperCase();
  // map common ESPN abbr to our local keys when possible
  const map = {
    "ARS":"ARS","MUN":"MUN","MAN UTD":"MUN","LIV":"LFC","MCI":"MCI","CHE":"CFC","TOT":"TOT",
    "NEW":"NEW","AVL":"AVL","BHA":"BRI","BRI":"BRI","EVE":"EVE","CRY":"CRY","FUL":"FUL",
    "BRE":"BRE","NFO":"NFO","BOU":"BOU","LEE":"LEE","IPS":"IPS","SUN":"SUN","HUL":"HUL","COV":"COV",
    "RMA":"RMA","BAR":"BAR","ATM":"ATM","SEV":"SEV","BET":"RBB","RSO":"RSO","VIL":"VIL","ATH":"ATH",
    "VAL":"VCF","CEL":"RCC","OSA":"OSA","GET":"GET","RAY":"RVC","ESP":"ESP","ALA":"ALA","LEV":"LEV",
    "ELC":"ELC","INT":"INT","MIL":"ACM","JUV":"JUV","NAP":"NAP","ROM":"ROM","LAZ":"LAZ","ATA":"ATA",
    "FIO":"FIO","TOR":"TOR","BOL":"BFC","GEN":"GEN","UDI":"UDI","CAG":"CAG","SAS":"SAS",
    "BAY":"BMU","BVB":"BVB","DOR":"BVB","RBL":"RBL","LEV":"LEV","SGE":"SGE","VFB":"VFB",
    "BMG":"BMG","SCF":"SCF","SVW":"SVW","FCU":"UNI","KOE":"KOE","TSG":"TSG","M05":"M05",
    "PSG":"PSG","OL":"OL","OM":"OLM","ASM":"ASM","LIL":"LIL","RCL":"RCL","REN":"REN","NIC":"NIC",
  };
  if(map[a]) return map[a];
  return a.slice(0,3);
}

async function fetchEspnScoreboard(leagueSlug, dateYYYYMMDD){
  const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueSlug}/scoreboard?dates=${dateYYYYMMDD}&limit=50`;
  const r = await fetch(url);
  if(!r.ok) throw new Error("ESPN "+leagueSlug+" "+r.status);
  return r.json();
}

function applyEspnEventsToEuro(leagueKey, data){
  const lg = EURO[leagueKey];
  if(!lg || !data || !data.events) return 0;
  let n = 0;
  data.events.forEach(ev=>{
    const comps = (ev.competitions && ev.competitions[0]) || {};
    const teams = comps.competitors || [];
    if(teams.length<2) return;
    const home = teams.find(c=>c.homeAway==="home") || teams[0];
    const away = teams.find(c=>c.homeAway==="away") || teams[1];
    const hAb = abbrFromEspnTeam(home.team);
    const aAb = abbrFromEspnTeam(away.team);
    // register names
    if(home.team) lg.names[hAb] = home.team.shortDisplayName || home.team.displayName || hAb;
    if(away.team) lg.names[aAb] = away.team.shortDisplayName || away.team.displayName || aAb;
    const status = mapEspnStatus(ev);
    const hs = home.score!=null && home.score!=="" ? parseInt(home.score,10) : 0;
    const as = away.score!=null && away.score!=="" ? parseInt(away.score,10) : 0;
    const when = (ev.status && ev.status.type && ev.status.type.shortDetail) || "";
    const date = (ev.date||"").slice(0,10);
    // match existing by teams or push new
    let m = lg.matches.find(x=>(x.home===hAb&&x.away===aAb)||(x.home===aAb&&x.away===hAb));
    if(!m){
      // try fuzzy by name
      m = lg.matches.find(x=>{
        const hn = (lg.names[x.home]||"").toLowerCase();
        const an = (lg.names[x.away]||"").toLowerCase();
        const ht = (home.team.displayName||"").toLowerCase();
        const at = (away.team.displayName||"").toLowerCase();
        return (hn && ht.includes(hn.slice(0,5))) || (an && at.includes(an.slice(0,5)));
      });
    }
    if(m){
      m.hs = status==="sched" ? m.hs : hs;
      m.as = status==="sched" ? m.as : as;
      if(status!=="sched") { m.hs = hs; m.as = as; }
      m.status = status;
      if(when) m.when = when;
      if(date) m.date = date;
      m.espnId = ev.id;
      n++;
    } else {
      lg.matches.push({
        id: "espn:"+ev.id, home:hAb, away:aAb, hs: status==="sched"?0:hs, as: status==="sched"?0:as,
        status, when: when||"ESPN", date: date||TODAY_DATE, espnId: ev.id
      });
      n++;
    }
  });
  return n;
}

function applyEspnArgToSA(data){
  if(!data || !data.events) return 0;
  const out = [];
  data.events.forEach(ev=>{
    const comps = (ev.competitions && ev.competitions[0]) || {};
    const teams = comps.competitors || [];
    if(teams.length<2) return;
    const home = teams.find(c=>c.homeAway==="home") || teams[0];
    const away = teams.find(c=>c.homeAway==="away") || teams[1];
    const status = mapEspnStatus(ev);
    const hs = home.score!=null && home.score!=="" ? parseInt(home.score,10) : null;
    const as = away.score!=null && away.score!=="" ? parseInt(away.score,10) : null;
    let when = (ev.status && ev.status.type && (ev.status.type.shortDetail || ev.status.type.detail)) || "";
    if(/scheduled/i.test(when)) when = "Programado";
    // Preferir displayName completo para matchear escudos
    const hName = home.team.displayName || home.team.shortDisplayName || "Local";
    const aName = away.team.displayName || away.team.shortDisplayName || "Visitante";
    out.push({
      comp:"🇦🇷 Clausura",
      home: hName,
      away: aName,
      hs: status==="sched" ? null : hs,
      as: status==="sched" ? null : as,
      status, when,
      espnId: ev.id,
      leagueSlug: "arg.1"
    });
  });
  if(out.length){
    // replace SA_TODAY content
    SA_TODAY.length = 0;
    out.forEach(x=>SA_TODAY.push(x));
  }
  return out.length;
}

async function refreshFromEspn(){
  const d = espnDateStr(new Date()); // local - may differ from AR
  // also try TODAY_DATE formatted
  const d2 = (TODAY_DATE||"").replace(/-/g,"");
  const dates = [...new Set([d2, d].filter(Boolean))];
  let updated = 0;
  const jobs = [];
  Object.keys(ESPN_LEAGUES).forEach(k=>{
    dates.forEach(dd=>{
      jobs.push(fetchEspnScoreboard(ESPN_LEAGUES[k], dd).then(data=>{
        updated += applyEspnEventsToEuro(k, data);
      }).catch(e=>console.warn("ESPN",k,e)));
    });
  });
  dates.forEach(dd=>{
    jobs.push(fetchEspnScoreboard(ESPN_ARG, dd).then(data=>{
      updated += applyEspnArgToSA(data);
    }).catch(e=>console.warn("ESPN arg",e)));
  });
  await Promise.all(jobs);
  return updated;
}


function handleRefresh(){
  const btn=document.getElementById("refreshBtn");
  btn.classList.add("spin");
  try{ Object.keys(SQUAD_CACHE).forEach(k=>delete SQUAD_CACHE[k]); }catch(e){}
  const label = btn.querySelector("span.espn-lab") || (()=>{ const s=document.createElement("span"); s.className="espn-lab"; s.style.marginLeft="4px"; s.style.fontSize="10px"; s.style.color="var(--dim)"; btn.appendChild(s); return s; })();
  label.textContent = "ESPN…";
  refreshFromEspn().then(n=>{
    label.textContent = n ? ("+"+n) : "ok";
    render();
    setTimeout(()=>{ btn.classList.remove("spin"); label.textContent=""; }, 800);
  }).catch(err=>{
    console.warn(err);
    label.textContent = "offline";
    render();
    setTimeout(()=>{ btn.classList.remove("spin"); label.textContent=""; }, 1000);
  });
}

function shuffleArr(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function randInt(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function randFloat(a,b){return a+Math.random()*(b-a);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function applyDelta(vals,delta){ if(!delta) return; Object.keys(delta).forEach(k=>{ if(k==="injury")return; vals[k]=(vals[k]||0)+delta[k]; }); }

/* ---------- flujo general ---------- */
function chooseRole(key){
  window.career = {role:key, phase:"setup", club:null, name:"", position:null};
  renderCareer();
}
function resetCareer(){ window.career=null; renderCareer(); }
function backToRoles(){ window.career=null; renderCareer(); }

function canConfirmSetup(){
  const c=window.career;
  if(!c) return false;
  return !!(c.name && c.name.trim().length>0 && c.club && (c.role!=="jugador" || c.position));
}
function onNameInput(v){
  window.career.name=v;
  const btn=document.getElementById("confirmSetupBtn");
  if(btn) btn.disabled = !canConfirmSetup();
}
function selectClub(idx){ window.career.club = UDL_CLUBS[idx]; renderCareer(); }
function selectPosition(key){ window.career.position=key; renderCareer(); }

function confirmSetup(){
  const c=window.career;
  if(!canConfirmSetup()) return;
  if(c.role==="jugador"){
    Object.assign(c,{phase:"playing",media:50,peakMedia:50,blockIndex:0,ages:AGES,rows:[],
      totals:{pj:0,gls:0,ast:0,trofeos:0},pendingEvent:null,resolved:false,lastResult:null,injuredThisBlock:false,blockIcon:null});
  } else {
    const meta=ROLES_META[c.role];
    Object.assign(c,{phase:"playing",round:1,total:8,statsVals:{...meta.start},
      order:shuffleArr(meta.events.map((_,i)=>i)),currentEvent:null,resolved:false,lastResult:null});
  }
  renderCareer();
}

function torneoName(blockIndex){
  return (blockIndex%2===0?"Apertura":"Clausura")+" "+(Math.floor(blockIndex/2)+1);
}
function optionButtonHTML(o,idx,fnName,delayIdx){
  let chips="";
  if(o.winChip) chips+=`<div class="chip pos" style="animation-delay:${(delayIdx*0.1)}s">${o.winChip}${o.pct<100?`<span>${o.pct}%</span>`:""}</div>`;

}

/* ---------- MOTOR DE MINIJUEGOS ---------- */
function resolveGameEvent(win, winTxtOverride, loseTxtOverride){
  const c = window.career;
  const ev = c.role==="jugador" ? c.pendingEvent : c.currentEvent;
  const delta = win?ev.winDelta:ev.loseDelta;
  if(c.role==="jugador"){
    if(delta){
      if(delta.media) c.media = clamp(c.media+delta.media,25,99);
      if(delta.trofeos) c.totals.trofeos += delta.trofeos;
      if(delta.injury) c.injuredThisBlock = true;
    }
    if(win && ev.winClub) c.club = ev.winClub;
    if(!win && ev.loseClub) c.club = ev.loseClub;
    if(ev.winClub||ev.loseClub) c.blockIcon="🔁";
    else if(delta && delta.trofeos) c.blockIcon="🏆";
    else if(delta && delta.injury) c.blockIcon="🤕";
    c.peakMedia = Math.max(c.peakMedia, c.media);
  } else {
    applyDelta(c.statsVals, delta);
  }
  c.lastResult = {win, text: winTxtOverride && win ? winTxtOverride : (loseTxtOverride && !win ? loseTxtOverride : (win?ev.winTxt:(ev.loseTxt||"")))};
  c.resolved = true;
  c.gameState = null;
  renderCareer();
}
function renderMiniGame(type){
  const c = window.career;
  if(!c.gameState || c.gameState.type!==type) c.gameState = createGameState(type);
  switch(type){
    case "saque": return `<div class="game-wrap"><p class="game-hint">Elegí rápido: una opción es la correcta.</p>${renderSaque()}</div>`;
    case "tictactoe": return `<div class="game-wrap"><p class="game-hint">Ganale al rival. El empate cuenta como fallo.</p>${renderTTT()}</div>`;
    case "rps": return `<div class="game-wrap"><p class="game-hint">Piedra, papel o tijera.</p>${renderRPS()}</div>`;
    case "definicion": return `<div class="game-wrap"><p class="game-hint">Frená la barra en la zona verde.</p>${renderDefinicion()}</div>`;
    case "memotest": return `<div class="game-wrap"><p class="game-hint">Encontrá las 6 parejas antes de quedarte sin vidas.</p>${renderMemo()}</div>`;
    case "simon": return `<div class="game-wrap"><p class="game-hint">Memorizá la secuencia y repetila.</p>${renderSimon()}</div>`;
    case "ruleta": return `<div class="game-wrap"><p class="game-hint">La ruleta del vestuario decide.</p>${renderRuleta()}</div>`;
    case "mayormenor": return `<div class="game-wrap">${renderMayorMenor()}</div>`;
    case "quiz": return `<div class="game-wrap">${renderQuiz()}</div>`;
    case "reaccion": return `<div class="game-wrap">${renderReaccion()}</div>`;
    case "penaldir": return `<div class="game-wrap">${renderPenalDir()}</div>`;
    case "colores": return `<div class="game-wrap">${renderColores()}</div>`;
  }
  return "";
}
function createGameState(type){
  if(type==="saque") return {type, right:Math.floor(Math.random()*4), picked:null};
  if(type==="tictactoe") return {type, board:Array(9).fill(null), over:false, status:""};
  if(type==="rps") return {type, picked:null, ai:null, result:null};
  if(type==="definicion"){
    const min = 30+Math.random()*20;
    return {type, start:performance.now(), zone:{min, max:min+18}, done:false};
  }
  if(type==="memotest"){
    const syms=["⚽","🏑","🏆","🥊","👟","📣"];
    const cards = shuffleArr([...syms,...syms]).map(s=>({sym:s,matched:false}));
    return {type, cards, flipped:[], lives:5, busy:false};
  }
  if(type==="simon"){
    const seq=[]; for(let i=0;i<4;i++) seq.push(Math.floor(Math.random()*9));
    return {type, seq, userSeq:[], phase:"showing", playing:false};
  }
  if(type==="ruleta") return {type, done:false, spinning:false, result:null};
  if(type==="mayormenor"){
    const shown=randInt(55,78); let hidden=randInt(50,85); if(hidden===shown) hidden+=1;
    return {type, shown, hidden, done:false};
  }
  if(type==="quiz"){
    const bank=[
      {q:"¿Cuántos jugadores hay en cancha por equipo?",opts:["10","11","12"],correct:1},
      {q:"Un penal se patea desde…",opts:["El córner","Los 12 pasos","El medio"],correct:1},
      {q:"¿Qué es un hat-trick?",opts:["3 goles","3 asistencias","3 tarjetas"],correct:0},
      {q:"La UDL es una liga de…",opts:["Entre Ríos","CABA","Mendoza"],correct:0},
      {q:"¿Cuánto dura un tiempo de fútbol profesional?",opts:["40 min","45 min","50 min"],correct:1},
    ];
    const item=bank[Math.floor(Math.random()*bank.length)];
    return {type, q:item.q, opts:item.opts, correct:item.correct, done:false};
  }
  if(type==="reaccion") return {type, phase:"wait", done:false, started:false};
  if(type==="penaldir"){
    const sides=["L","C","R"];
    return {type, keeper:sides[Math.floor(Math.random()*3)], done:false};
  }
  if(type==="colores"){
    const seq=[]; for(let i=0;i<4;i++) seq.push(Math.floor(Math.random()*4));
    return {type, seq, user:[], phase:"show", lit:-1, playing:false, done:false};
  }
  return {type};
}

/* ----- ta-te-ti ----- */
const TTT_LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tttWinner(b){
  for(const [a,c,d] of TTT_LINES){ if(b[a] && b[a]===b[c] && b[a]===b[d]) return b[a]; }
  return null;
}
function renderTTT(){
  const gs=window.career.gameState;
  let html = `<div class="ttt-board">`;
  gs.board.forEach((v,i)=>{
    html += `<div class="ttt-cell ${v==="X"?"x":v==="O"?"o":""}" onclick="tttClick(${i})">${v||""}</div>`;
  });
  html += `</div><div class="ttt-status">${gs.status}</div>`;
  return html;
}
function tttClick(i){
  const gs=window.career.gameState;
  if(gs.over || gs.board[i]) return;
  gs.board[i]="X";
  let w=tttWinner(gs.board);
  if(w){ gs.over=true; gs.status="¡Ganaste!"; renderCareer(); setTimeout(()=>resolveGameEvent(true),700); return; }
  if(gs.board.every(c=>c)){ gs.over=true; gs.status="Empate."; renderCareer(); setTimeout(()=>resolveGameEvent(false),700); return; }
  // turno rival: gana si puede, bloquea si puede, si no random
  let move = findTTTMove(gs.board,"O") ?? findTTTMove(gs.board,"X") ?? emptyTTT(gs.board)[Math.floor(Math.random()*emptyTTT(gs.board).length)];
  gs.board[move]="O";
  w=tttWinner(gs.board);
  if(w){ gs.over=true; gs.status="Ganó el rival."; renderCareer(); setTimeout(()=>resolveGameEvent(false),700); return; }
  if(gs.board.every(c=>c)){ gs.over=true; gs.status="Empate."; renderCareer(); setTimeout(()=>resolveGameEvent(false),700); return; }
  renderCareer();
}
function emptyTTT(b){ const r=[]; b.forEach((v,i)=>{if(!v)r.push(i);}); return r; }
function findTTTMove(b,player){
  for(const i of emptyTTT(b)){ const t=[...b]; t[i]=player; if(tttWinner(t)===player) return i; }
  return null;
}

const RPS_ICON={rock:"🪨",paper:"📄",scissors:"✂️"};
function renderRPS(){
  const gs=window.career.gameState;
  let html = `<div class="rps-grid">
    <button class="rps-btn" onclick="rpsPick('rock')" ${gs.picked?"disabled":""}>🪨</button>
    <button class="rps-btn" onclick="rpsPick('paper')" ${gs.picked?"disabled":""}>📄</button>
    <button class="rps-btn" onclick="rpsPick('scissors')" ${gs.picked?"disabled":""}>✂️</button>
  </div><div class="rps-result">${gs.result||""}</div>`;
  return html;
}
function rpsPick(choice){
  const gs=window.career.gameState;
  if(gs.picked) return;
  gs.picked=choice;
  const opts=["rock","paper","scissors"];
  let ai, tries=0, outcome;
  do{
    ai = opts[Math.floor(Math.random()*3)];
    outcome = rpsOutcome(choice,ai);
    tries++;
  } while(outcome==="tie" && tries<3);
  if(outcome==="tie") outcome="win"; // desempate a favor tras varios intentos
  gs.ai=ai;
  gs.result = `Vos: ${RPS_ICON[choice]} · Rival: ${RPS_ICON[ai]} — ${outcome==="win"?"¡Ganaste!":"Perdiste."}`;
  renderCareer();
  setTimeout(()=>resolveGameEvent(outcome==="win"),750);
}
function rpsOutcome(p,a){
  if(p===a) return "tie";
  if((p==="rock"&&a==="scissors")||(p==="paper"&&a==="rock")||(p==="scissors"&&a==="paper")) return "win";
  return "lose";
}

function memoFlip(i){
  const gs=window.career.gameState;
  if(gs.busy || gs.cards[i].matched || gs.flipped.includes(i) || gs.flipped.length>=2) return;
  gs.flipped.push(i);
  renderCareer();
  if(gs.flipped.length===2){
    gs.busy=true;
    const [a,b]=gs.flipped;
    const match = gs.cards[a].sym===gs.cards[b].sym;
    setTimeout(()=>{
      if(match){ gs.cards[a].matched=true; gs.cards[b].matched=true; }
      else{ gs.lives--; }
      gs.flipped=[]; gs.busy=false;
      const allMatched = gs.cards.every(c=>c.matched);
      if(allMatched){ resolveGameEvent(true); return; }
      if(gs.lives<=0){ resolveGameEvent(false); return; }
      renderCareer();
    },700);
  }
}

function ensureEvent(c){
  if(c.pendingEvent) return;
  const age = c.ages[c.blockIndex];
  if(age>16 && Math.random()<0.28){
    const options = UDL_CLUBS.filter(x=>x.name!==c.club.name);
    const target = options[Math.floor(Math.random()*options.length)];
    c.pendingEvent = {
      title:`Oferta de ${target.name}`,
      desc:`${target.name} pregunta por vos para el próximo ${torneoName(c.blockIndex)}.`,
      opts:[
        {label:`Fichar por ${target.name}`,pct:55,winChip:"+4 Media",loseChip:"-5 Media (cuesta adaptarse)",
          winDelta:{media:4},loseDelta:{media:-5},winClub:target,loseClub:target,
          winTxt:`Te fuiste a ${target.name} y explotaste.`,loseTxt:`Te fuiste a ${target.name} y costó agarrar ritmo.`},
        {label:`Quedarte en ${c.club.name}`,pct:100,winChip:"+1 Media (lealtad)",loseChip:null,
          winDelta:{media:1},loseDelta:{},winTxt:`Seguiste en ${c.club.name}, la hinchada te lo agradece.`}
      ]};
    c.blockIconIfTransfer="🔁";
  } else {
    const games = JUGADOR_EVENTS_POOL.filter(e=>e.game);
    const normals = JUGADOR_EVENTS_POOL.filter(e=>!e.game);
    // ~55% chance de minijuego para que aparezcan más
    const tmpl = (Math.random()<0.55 && games.length)
      ? games[Math.floor(Math.random()*games.length)]
      : JUGADOR_EVENTS_POOL[Math.floor(Math.random()*JUGADOR_EVENTS_POOL.length)];
    const torneo = torneoName(c.blockIndex);
    c.pendingEvent = {
      title: tmpl.title.replace(/\{torneo\}/g,torneo),
      desc: tmpl.desc.replace(/\{torneo\}/g,torneo).replace(/\{club\}/g,c.club.name),
      opts: tmpl.opts ? tmpl.opts.map(o=>({...o})) : undefined,
      game: tmpl.game, winDelta: tmpl.winDelta, loseDelta: tmpl.loseDelta, winTxt: tmpl.winTxt, loseTxt: tmpl.loseTxt
    };
  }
}
function resolveJugadorOption(idx){
  const c=window.career; const opt=c.pendingEvent.opts[idx];
  const win = Math.random()*100 < opt.pct;
  const delta = win?opt.winDelta:opt.loseDelta;
  applyDelta(c, {}); // no-op safeguard
  if(delta){
    if(delta.media) c.media = clamp(c.media+delta.media,25,99);
    if(delta.trofeos) c.totals.trofeos += delta.trofeos;
    if(delta.injury) c.injuredThisBlock = true;
  }
  if(win && opt.winClub) c.club = opt.winClub;
  if(!win && opt.loseClub) c.club = opt.loseClub;
  if(opt.winClub || opt.loseClub) c.blockIcon = "🔁";
  else if(delta && delta.trofeos) c.blockIcon = "🏆";
  else if(delta && delta.injury) c.blockIcon = "🤕";
  c.peakMedia = Math.max(c.peakMedia, c.media);
  c.lastResult = {win, text: win?opt.winTxt:(opt.loseTxt||"")};
  c.resolved = true;
  renderCareer();
}
function simulateBlockAndAdvance(){
  const c=window.career;
  const age = c.ages[c.blockIndex];
  let curveDelta;
  if(age<26) curveDelta=randInt(2,7);
  else if(age<32) curveDelta=randInt(-1,3);
  else curveDelta=randInt(-6,-1);
  c.media = clamp(c.media+curveDelta,25,99);
  c.peakMedia = Math.max(c.peakMedia,c.media);
  const pos = POSITIONS.find(p=>p.key===c.position);
  let matches = randInt(20,68);
  if(c.injuredThisBlock) matches = Math.round(matches*0.4);
  const mediaFactor = c.media/70;
  const goals = Math.max(0,Math.round(matches*pos.goal*mediaFactor*randFloat(0.7,1.3)));
  const assists = Math.max(0,Math.round(matches*pos.assist*mediaFactor*randFloat(0.7,1.3)));
  c.totals.pj += matches; c.totals.gls += goals; c.totals.ast += assists;
  c.rows.push({age,club:c.club,media:Math.round(c.media),pj:matches,gls:goals,ast:assists,icon:c.blockIcon||""});
  c.injuredThisBlock=false; c.blockIcon=null;
  c.blockIndex++;
  c.pendingEvent=null; c.resolved=false; c.lastResult=null;
  if(c.blockIndex >= c.ages.length-1) c.phase="done";
  renderCareer();
}

      <div class="pname">${c.name.toUpperCase()}<span class="posbadge">${c.position}</span></div>
      <div class="pclub"><img src="${c.club.crest}" class="mini-crest">${c.club.name}</div>
      <div class="page">Edad ${age} · ${torneoName(c.blockIndex)}</div>
    </div>
  </div>`;
  const hud = `<div class="career-hud">
    <div class="hud-stat"><div class="v">${c.totals.pj}</div><div class="k">PJ</div></div>
    <div class="hud-stat"><div class="v">${c.totals.gls}</div><div class="k">Goles</div></div>
    <div class="hud-stat"><div class="v">${c.totals.ast}</div><div class="k">Asist.</div></div>
    <div class="hud-stat"><div class="v">${c.totals.trofeos}</div><div class="k">Trofeos</div></div>
  </div>`;
  const table = renderCareerTable(c);
  const ev = c.pendingEvent;
  let card = `<div class="event-card"><h3>${ev.title}</h3><p class="desc">${ev.desc}</p>`;
  if(!c.resolved){
    if(ev.game) card += renderMiniGame(ev.game);
    else ev.opts.forEach((o,i)=>{ card += optionButtonHTML(o,i,"resolveJugadorOption",i); });
  } else {
    card += `<div class="result-banner ${c.lastResult.win?"ok":"bad"}">${c.lastResult.text}</div>
      <button class="again-btn" style="margin-top:12px" onclick="simulateBlockAndAdvance()">Siguiente temporada →</button>`;
  }
  card += `</div>`;
  el.innerHTML = header + hud + table + card;
  if(ev.game==="simon" && c.gameState && c.gameState.phase==="showing") simonPlayback();
  if(ev.game==="reaccion" && c.gameState && !c.gameState.started) startReaccion();
  if(ev.game==="colores" && c.gameState && c.gameState.phase==="show" && !c.gameState.playing) playColores();
}

/* ---------- carrera de PRESIDENTE / TÉCNICO ---------- */
function instantiateClubEvent(tmpl,c){
  const opts = UDL_CLUBS.filter(x=>x.name!==c.club.name);
  const rival = opts[Math.floor(Math.random()*opts.length)];
  const torneo = torneoName(c.round-1);
  const rep = s => s.replace(/\{rival\}/g,rival.name).replace(/\{club\}/g,c.club.name).replace(/\{torneo\}/g,torneo);
  if(tmpl.game){
    return {title:rep(tmpl.title),desc:rep(tmpl.desc),game:tmpl.game,winDelta:tmpl.winDelta,loseDelta:tmpl.loseDelta,winTxt:tmpl.winTxt,loseTxt:tmpl.loseTxt};
  }
  return {title:rep(tmpl.title),desc:rep(tmpl.desc),opts:tmpl.opts.map(o=>({...o,label:rep(o.label)}))};
}
function resolveClubOption(idx){
  const c=window.career; const opt=c.currentEvent.opts[idx];
  if(opt.cost) applyDelta(c.statsVals,opt.cost);
  const win = Math.random()*100<opt.pct;
  applyDelta(c.statsVals, win?opt.winDelta:opt.loseDelta);
  c.lastResult={win,text:win?opt.winTxt:(opt.loseTxt||"")};
  c.resolved=true; renderCareer();
}
function nextClubRound(){
  const c=window.career; c.round++; c.resolved=false; c.lastResult=null; c.currentEvent=null;
  if(c.round>c.total) c.phase="done";
  renderCareer();
}
function clubTier(c,meta){
  let score=0;
  if(c.role==="presidente") score = c.statsVals.hinchada + c.statsVals.presupuesto*0.5 + c.statsVals.trofeos*15;
  if(c.role==="tecnico") score = c.statsVals.continuidad + c.statsVals.puntos*1.5 + c.statsVals.trofeos*15;
  if(score>=140) return "🐐 LEYENDA ETERNA DE LA UDL";
  if(score>=105) return "🏆 ÍDOLO DE LA HINCHADA";
  if(score>=75) return "😌 GESTIÓN CORRECTA";
  if(score>=45) return "😬 SE SALVÓ COMO PUDO";
  return "💀 CATÁSTROFE TOTAL";
}
function renderClubCareer(el,c){
  const meta = ROLES_META[c.role];
  if(c.phase==="done"){
    el.innerHTML = `<div class="legend-card">
      <div class="tier">${clubTier(c,meta)}</div>
      <div class="sub">${c.name.toUpperCase()} · ${meta.label} de ${c.club.name} · ${c.total} torneos</div>
      <div class="legend-stats">${meta.stats.map(s=>`<div>${s.label}<b>${c.statsVals[s.key]}</b></div>`).join("")}</div>
      <button class="again-btn" onclick="resetCareer()">Jugar de nuevo</button>
    </div>`;
    return;
  }
  if(!c.currentEvent){
    const tmplIdx = c.order[(c.round-1) % c.order.length];
    c.currentEvent = instantiateClubEvent(meta.events[tmplIdx],c);
  }
  const header = `<div class="player-card">
    <img src="${c.club.crest}" class="mini-crest" style="width:34px;height:34px;">
    <div class="player-meta"><div class="pname">${c.name.toUpperCase()}</div><div class="pclub">${meta.label} de ${c.club.name}</div></div>
  </div>`;
  const hud = `<div class="career-hud">${meta.stats.map(s=>`<div class="hud-stat"><div class="v">${c.statsVals[s.key]}</div><div class="k">${s.label}</div></div>`).join("")}</div>`;
  let body = `<div class="season-tag">Torneo ${torneoName(c.round-1)} — ${c.round}/${c.total}</div>`;
  const ev = c.currentEvent;
  body += `<div class="event-card"><h3>${ev.title}</h3><p class="desc">${ev.desc}</p>`;
  if(!c.resolved){
    if(ev.game) body += renderMiniGame(ev.game);
    else ev.opts.forEach((o,i)=>{ body += optionButtonHTML(o,i,"resolveClubOption",i); });
  } else {
    body += `<div class="result-banner ${c.lastResult.win?"ok":"bad"}">${c.lastResult.text}</div>
      <button class="again-btn" style="margin-top:12px" onclick="nextClubRound()">${c.round<c.total?"Siguiente torneo →":"Ver resumen final →"}</button>`;
  }
  body += `</div>`;
  el.innerHTML = header + hud + body;
  if(ev.game==="simon" && c.gameState && c.gameState.phase==="showing") simonPlayback();
  if(ev.game==="reaccion" && c.gameState && !c.gameState.started) startReaccion();
  if(ev.game==="colores" && c.gameState && c.gameState.phase==="show" && !c.gameState.playing) playColores();
}

/* ---------- dispatcher ---------- */
function renderCareer(){
  const el = document.getElementById("careerPanel");
  if(!window.career){ el.innerHTML = roleSelectHTML(); return; }
  const c = window.career;
  if(c.phase==="setup"){ el.innerHTML = setupHTML(c); return; }
  if(c.role==="jugador") renderJugadorCareer(el,c);
  else renderClubCareer(el,c);
}

/* init */
window.__euroSub="partidos";
initTabs();
render();
// ESPN auto al abrir (silencioso)
try{ refreshFromEspn().then(()=>render()).catch(()=>{}); }catch(e){}

</script>
